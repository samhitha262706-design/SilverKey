server:
  applicationConnectors:
    - type: http
      port: 8080

  adminConnectors:
    - type: http
      port: 8081
database:
  driverClass: org.postgresql.Driver
  user: silverkey_user
  password: ${DB_PASSWORD}
  url: jdbc:postgresql://localhost:5432/silverkey

  properties:
    charSet: UTF-8

  maxWaitForConnection: 1s
  validationQuery: "SELECT 1"

  minSize: 8
  maxSize: 32
  checkConnectionWhileIdle: true

jwt:
  secret: "replace-this-with-a-long-random-secret-key"
  expirationMinutes: 15

logging:
  level: INFO